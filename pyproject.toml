[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acousticscope"
version = "0.1.0"
description = "Automated acoustic testing prototype for studying bias in voice assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
experiment = [
  "pandas>=2.0",
  "scipy>=1.10",
  "torch>=2.0",
  "transformers>=4.35",
  "sounddevice>=0.4",
  "pygame>=2.5",
  "TTS>=0.22",
  "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
